# Статическая версия «Волны» на GitHub Pages.
# Раз в час собирает ленты (тот же код, что и python run.py), достаёт полный текст
# верхних статей и публикует сайт в ветку gh-pages → https://<логин>.github.io/<репозиторий>/
# Запустить вручную: вкладка Actions → «Сайт на GitHub Pages» → Run workflow.
name: Сайт на GitHub Pages

on:
  schedule:
    - cron: "17 * * * *"      # каждый час (GitHub может запускать с задержкой)
  workflow_dispatch:
  push:
    paths:
      - "static/**"
      - "mynews/**"
      - "tools/build_site.py"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: write   # пуш в ветку gh-pages
  pages: write      # попытка включить Pages, если ещё не включены

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Публикуем только из основной ветки: черновые ветки не перезаписывают сайт.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYNEWS_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # База между запусками: пул новостей за 36 часов и кэш текстов статей.
      - name: Восстановить базу новостей
        uses: actions/cache/restore@v4
        with:
          path: data
          key: volna-data-${{ github.run_id }}
          restore-keys: volna-data-

      - name: Собрать новости и сайт
        run: python tools/build_site.py --out site

      - name: Сохранить базу новостей
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: volna-data-${{ github.run_id }}

      - name: Опубликовать в ветку gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Выпуск $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Каждый выпуск — один коммит без истории, чтобы репозиторий не разрастался.
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Проверить, что Pages включены
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '"Сайт: " + .html_url'; then exit 0; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" --jq '"Pages включены: " + .html_url' \
            || echo "::warning::Включите Pages: Settings → Pages → Deploy from a branch → gh-pages / (root)"
